<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Networking Mini-Site</title>
<link rel="stylesheet" href="css/mkeerthi.css">
</head>
<body>

<header>
  <h1>🌐 Social Hub</h1>
  <p>Connect • Share • Express</p>
</header>

<nav>
  <input type="text" id="searchBox" placeholder="Search posts...">
</nav>

<section class="create-post">
    <textarea id="postInput" placeholder="What's on your mind?"></textarea>
    <button onclick="addPost()">Post</button>
</section>

<h2 class="feed-title">📰 News Feed</h2>
<div id="feed"></div>

<script src="css/javascript/mkeerthi.js"></script>
</body>
</html>
